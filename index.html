<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#2457a6">
<title>得正｜優惠展示</title>
<style>
:root{--blue:#2457a6;--deep:#173f83;--cream:#f4f0e8;--ink:#26364d}
*{box-sizing:border-box}
body{margin:0;background:linear-gradient(145deg,#e9edf3,#f5f0e8 60%,#dce6f4);font-family:system-ui,-apple-system,"Noto Sans TC",sans-serif;color:var(--ink)}
header{background:var(--blue);color:#fff;text-align:center;padding:20px 14px;box-shadow:0 5px 18px #173f8326}
.brand{font-size:clamp(27px,5vw,38px);font-weight:800;letter-spacing:.16em}
.sub{font-size:13px;letter-spacing:.04em;margin-top:5px}
.notice{width:min(900px,calc(100% - 24px));margin:16px auto;padding:10px 14px;border:1px solid #d6b77b;background:#fff8e8;border-radius:10px;color:#664a19;font-size:13px;line-height:1.65}
main{width:min(940px,calc(100% - 24px));margin:20px auto 34px}
.card{background:#fff;border-radius:18px;overflow:hidden;margin:0 0 22px;box-shadow:0 12px 30px #183b6c17;border:1px solid #e4e9f1}
img{display:block;width:100%;height:auto}
.claim{display:block;text-decoration:none;color:inherit}
.claim img{width:100%}
.claim-cta{display:block;text-align:center;background:#f6d400;color:#111;font-weight:800;font-size:22px;letter-spacing:.08em;padding:15px 18px}
.claim:focus-visible{outline:4px solid #f4c400;outline-offset:3px}
.caption{text-align:center;padding:10px 14px 16px;font-size:13px;color:#52627a}
footer{text-align:center;padding:0 16px 28px;color:#5b6880;font-size:12px;line-height:1.7}
@media(min-width:700px){main{margin-top:24px}.card{margin-bottom:26px}}
</style>
</head>
<body>
<header>
  <div class="brand">得正</div>
  <div class="sub">OOLONG TEA PROJECT · 圖片展示</div>
</header>
<div class="notice">活動經品牌官方授權或認證；本頁代表得正官方.優惠內容及可用性。</div>
<main>
  <section class="card">
    <a class="claim" href="https://lin.ee/rhk0l8g" target="_blank" rel="noopener noreferrer" aria-label="點擊前往外部領取優惠">
      <img src="claim.png" alt="活動優惠，點擊圖片可前往領取兌換券">
      <span class="claim-cta">點擊領取／前往 領取兌換券</span>
    </a>
    <div class="caption">點擊上方圖片或按鈕，將開啟外部優惠活動頁面。</div>
  </section>
  <section class="card"><img src="drink.png" alt="得正飲品照片"></section>
  <section class="card"><img src="menu.png" alt="得正飲品菜單"></section>
</main>
</body>
</html>
